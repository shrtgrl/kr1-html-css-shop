<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 100" width="306" height="100" role="img" aria-labelledby="remi-title">
  <title id="remi-title">ReMi — рояли и пианино</title>

  <!-- Знак: клавиши до-ре-ми, «ре» и «ми» выделены -->
  <g transform="translate(6 10)">
    <rect x="0"  y="0" width="26" height="80" rx="4" fill="#FFFFFF" stroke="#332E2B" stroke-width="2"/>
    <rect x="28" y="0" width="26" height="80" rx="4" fill="#72393F" stroke="#332E2B" stroke-width="2"/>
    <rect x="56" y="0" width="26" height="80" rx="4" fill="#72393F" stroke="#332E2B" stroke-width="2"/>
    <rect x="18" y="-1" width="16" height="48" rx="3" fill="#332E2B"/>
    <rect x="48" y="-1" width="16" height="48" rx="3" fill="#332E2B"/>
    <text x="41" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#F0E9E3">D</text>
    <text x="69" y="72" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#F0E9E3">E</text>
  </g>

  <!-- Надпись -->
  <text x="104" y="64" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="1">
    <tspan fill="#332E2B">Re</tspan><tspan fill="#72393F">Mi</tspan>
  </text>
  <line x1="106" y1="76" x2="298" y2="76" stroke="#AD9D8D" stroke-width="1.5"/>
  <text x="106" y="93" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="4.2" fill="#6B605A">РОЯЛИ · ПИАНИНО</text>
